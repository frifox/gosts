# Release: pushing a GoSTS Rig version tag (gosts-rig-v1.0.0, say: plain
# v1.0.0 tags are the library's, Go module versions) builds GoSTS Rig for
# macOS (Apple silicon, signed ad hoc) with what it bundles (gosts-rig and
# Build Model's apple-obj-cap), and puts it on the tag's GitHub Release,
# "GoSTS Rig v1.0.0".
#
#   git tag gosts-rig-v1.0.0 && git push origin gosts-rig-v1.0.0
name: Release

on:
  push:
    tags: ["gosts-rig-v*"]

permissions:
  contents: write # (to make the Release)

jobs:
  macos-app:
    runs-on: macos-15 # Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (the tags: build.sh names the version after them)

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build GoSTS Rig.app
        run: make

      - name: Zip
        run: |
          cd cmd/gosts-rig-macos/build
          ditto -c -k --sequesterRsrc --keepParent "GoSTS Rig.app" "GoSTS-Rig-${GITHUB_REF_NAME#gosts-rig-}-macos-arm64.zip"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#gosts-rig-}" # (v1.0.0)
          zip="cmd/gosts-rig-macos/build/GoSTS-Rig-${version}-macos-arm64.zip"
          notes="Automated photogrammetry rig. Configure hardware, capture photos, generate/edit 3D models. Use with MacOS."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "GoSTS Rig ${version}" --notes "$notes"
          fi
