# Release: pushing a version tag (v0.1.0, say) builds GoSTS Rig for macOS
# (Apple silicon, signed ad hoc) with what it bundles (gosts-rig and Build
# Model's apple-obj-cap), and puts it on the tag's GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # (to make the Release)

jobs:
  macos-app:
    runs-on: macos-15 # Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # (the tags: build.sh names the version after them)

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build GoSTS Rig.app
        run: make

      - name: Zip
        run: |
          cd cmd/gosts-rig-macos/build
          ditto -c -k --sequesterRsrc --keepParent "GoSTS Rig.app" "GoSTS-Rig-${GITHUB_REF_NAME}-macos-arm64.zip"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="cmd/gosts-rig-macos/build/GoSTS-Rig-${GITHUB_REF_NAME}-macos-arm64.zip"
          notes="GoSTS Rig for macOS (Apple silicon). Unzip and move it to Applications. It's signed ad hoc, not by Apple, so the first time: open it once, then System Settings → Privacy & Security → Open Anyway (on macOS 14 and earlier, right-click → Open works too). For a real camera: brew install gphoto2."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"
          fi
